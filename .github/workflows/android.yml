name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "mzu/**"]
    paths:
      - "src/**"
      - "android/**"
      - "public/**"
      - "scripts/**"
      - "package*.json"
      - "capacitor.config.json"
      - "next.config.mjs"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # L'SDK Android è già installato sul runner: basta accettare le licenze.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build web app (static export)
        run: npm run build
        env:
          BUILD_TARGET: android

      - name: Sync Capacitor
        run: npx cap sync android

      # Seconda app, minimale (timer + compiti): stesso codice, costruito con l'edizione "focus".
      - name: Build web app (focus edition)
        run: |
          rm -rf .next out
          npm run build
          mkdir -p android/app/src/focus/assets
          rm -rf android/app/src/focus/assets/public
          cp -r out android/app/src/focus/assets/public
        env:
          BUILD_TARGET: android
          NEXT_PUBLIC_EDITION: focus

      # Firma stabile: i segreti contengono la chiave (vedi README). Senza segreti si costruisce comunque, con firma di debug.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/filo.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/filo.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Nessuna chiave di firma configurata: APK con firma di debug (cambia a ogni build)."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNED" ]; then ./gradlew assembleLiteRelease assembleFocusRelease --no-daemon; else ./gradlew assembleLiteDebug assembleFocusDebug --no-daemon; fi

      # Si pubblica la versione "lite" (senza servizio di accessibilità) come app principale.
      - name: Name the APK
        run: |
          if [ -n "$SIGNED" ]; then
            cp android/app/build/outputs/apk/lite/release/app-lite-release.apk filo.apk
            cp android/app/build/outputs/apk/focus/release/app-focus-release.apk filo-focus.apk
          else
            cp android/app/build/outputs/apk/lite/debug/app-lite-debug.apk filo.apk
            cp android/app/build/outputs/apk/focus/debug/app-focus-debug.apk filo-focus.apk
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs filo.apk | grep -E "certificate (DN|SHA-256)"

      - uses: actions/upload-artifact@v4
        with:
          name: filo-apk
          path: |
            filo.apk
            filo-focus.apk

      - name: Publish to release "android-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "Filo per Android" \
              --notes "Ultima versione dell'app Android. Scarica filo.apk e installala sul telefono."
          gh release upload android-latest filo.apk filo-focus.apk --clobber
          gh release delete-asset android-latest filo-lite.apk -y || true
