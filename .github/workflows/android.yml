name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "public/**"
      - "scripts/**"
      - "package*.json"
      - "capacitor.config.json"
      - "next.config.mjs"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app (static export)
        run: npm run build
        env:
          BUILD_TARGET: android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk filo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: filo-apk
          path: filo.apk

      - name: Publish to release "android-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "Filo per Android" \
              --notes "Ultima versione dell'app Android. Scarica filo.apk e installala sul telefono."
          gh release upload android-latest filo.apk --clobber
